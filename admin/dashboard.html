<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت حمید مارکت</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            margin: 0;
        }

        .logout {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 25px auto;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .card h3 {
            margin-top: 0;
            color: #666;
        }

        .number {
            font-size: 25px;
            font-weight: bold;
        }

        .table-box {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

        .search {
            width: 100%;
            padding: 13px;
            margin: 15px 0 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th,
        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
            text-align: center;
        }

        th {
            background: #eee;
        }

        a {
            color: #1565c0;
            text-decoration: none;
        }

        .error {
            color: red;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 700px) {

            .cards {
                grid-template-columns: 1fr;
            }

            header {
                flex-direction: column;
                gap: 15px;
            }

        }

    </style>
</head>
<body>

        <header>
    
            <h2>پنل مدیریت حمید مارکت</h2>
    
            <button class="logout" onclick="logout()">
                خروج
            </button>
    
        </header>
    
    
        <div class="container">
    
            <div class="cards">
    
                <div class="card">
    
                    <h3>تعداد مشتری‌ها</h3>
    
                    <div class="number" id="customerCount">
                        -
                    </div>
    
                </div>
    
    
                <div class="card">
    
                    <h3>کل بدهی مشتری‌ها</h3>
    
                    <div class="number" id="totalDebt">
                        -
                    </div>
    
                </div>
    
    
                <div class="card">
    
                    <h3>آخرین بروزرسانی</h3>
    
                    <div class="number" id="lastUpdate">
                        -
                    </div>
    
                </div>
    
            </div>
    
    
            <div class="table-box">
    
                <h2>لیست مشتری‌ها</h2>
    
                <input
                    type="text"
                    id="search"
                    class="search"
                    placeholder="جستجو با نام یا کد مشتری..."
                >
                <div style="margin-bottom: 20px;">

                        <button
                            onclick="sortCustomers('high')"
                            style="
                            padding: 10px 18px;
                            border: none;
                            border-radius: 8px;
                            background: #222;
                            color: white;
                            cursor: pointer;
                            margin-left: 8px;
                            "
                        >
                            بیشترین بدهی
                        </button>
                    
                    
                        <button
                            onclick="sortCustomers('low')"
                            style="
                            padding: 10px 18px;
                            border: none;
                            border-radius: 8px;
                            background: #666;
                            color: white;
                            cursor: pointer;
                            "
                        >
                            کمترین بدهی
                        </button>
                    
                    </div>
    
    
                <div class="table-container">
    
                    <table>
    
                        <thead>
    
                            <tr>
                                <th>کد</th>
                                <th>نام مشتری</th>
                                <th>مبلغ حساب</th>
                                <th>تاریخ</th>
                                <th>ریز حساب</th>
                            </tr>
    
                        </thead>
    
    
                        <tbody id="customerTable">
    
                            <tr>
                                <td colspan="5">
                                    در حال دریافت اطلاعات...
                                </td>
                            </tr>
    
                        </tbody>
    
                    </table>
    
                </div>
    
            </div>
    
        </div>

        <div style="
        display: inline-block;
        padding: 12px 25px;
        background: #222;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-size: 15px;
        text-align: center;
        ">>
            <a href="https://hamidmarket.github.io/hesab/">
                <button>ورود به سایت اصلی</button>
            </a>
        </div>
    
    
        <script>
let customers = {};


// دریافت اطلاعات مشتری‌ها
fetch("../customers.json")
    .then(response => response.json())
    .then(data => {

        customers = data;

        showCustomers(customers);

        updateDashboard(customers);

    })
    .catch(error => {

        console.error(error);

        document.getElementById("customerTable").innerHTML = `
            <tr>
                <td colspan="5" class="error">
                    خطا در خواندن اطلاعات مشتری‌ها
                </td>
            </tr>
        `;

    });


// نمایش مشتری‌ها
function showCustomers(data) {

    const table = document.getElementById("customerTable");

    table.innerHTML = "";

    Object.entries(data).forEach(([code, customer]) => {

        const row = document.createElement("tr");

        row.innerHTML = `
            <td>${code}</td>

            <td>${customer.name || "-"}</td>

            <td>${customer.money || "0 تومان"}</td>

            <td>${customer.date || "-"}</td>

            <td>
                ${
                    customer.file
                    ? `<a href="../${customer.file}" target="_blank">نمایش</a>`
                    : "-"
                }
            </td>
        `;

        table.appendChild(row);

    });

}


// اطلاعات بالای داشبورد
function updateDashboard(data) {

    const customerList = Object.values(data);


    // تعداد مشتری‌ها
    document.getElementById("customerCount").textContent =
        customerList.length.toLocaleString("fa-IR");


    // جمع کل بدهی
    let totalDebt = 0;

    customerList.forEach(customer => {

        let money = String(customer.money || "0");

        money = money
            .replace("تومان", "")
            .replace(/\./g, "")
            .replace(/,/g, "")
            .trim();

        totalDebt += Number(money) || 0;

    });


    document.getElementById("totalDebt").textContent =
        totalDebt.toLocaleString("fa-IR") + " تومان";

}


// جستجو
document.getElementById("search").addEventListener("input", function () {

    const searchValue =
        this.value.trim().toLowerCase();

    const filtered = {};


    Object.entries(customers).forEach(([code, customer]) => {

        const name =
            String(customer.name || "").toLowerCase();


        if (
            code.toLowerCase().includes(searchValue) ||
            name.includes(searchValue)
        ) {

            filtered[code] = customer;

        }

    });


    showCustomers(filtered);

});


// مرتب‌سازی
function sortCustomers(type) {

    const sorted = Object.entries(customers);


    sorted.sort((a, b) => {

        let moneyA = String(a[1].money || "0")
            .replace("تومان", "")
            .replace(/\./g, "")
            .replace(/,/g, "")
            .trim();

        let moneyB = String(b[1].money || "0")
            .replace("تومان", "")
            .replace(/\./g, "")
            .replace(/,/g, "")
            .trim();


        moneyA = Number(moneyA) || 0;

        moneyB = Number(moneyB) || 0;


        if (type === "high") {

            return moneyB - moneyA;

        } else {

            return moneyA - moneyB;

        }

    });


    const sortedCustomers = {};


    sorted.forEach(([code, customer]) => {

        sortedCustomers[code] = customer;

    });


    showCustomers(sortedCustomers);

}


// خروج
function logout() {

    window.location.href = "index.html";

} 
</script>

</body>

</html>
