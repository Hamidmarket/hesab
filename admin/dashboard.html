‏!DOCTYPE html>
‏<html lang="fa" dir="rtl">

‏<head>
‏    <meta charset="UTF-8">
‏    <meta name="viewport" content="width=device-width, initial-scale=1.0">
‏    <title>پنل مدیریت حمید مارکت</title>

‏    <style>
        * {
‏            box-sizing: border-box;
        }

‏        body {
‏            margin: 0;
‏            font-family: Tahoma, Arial, sans-serif;
‏            background: #f5f5f5;
‏            color: #222;
        }

‏        header {
‏            background: #222;
‏            color: white;
‏            padding: 20px;
‏            display: flex;
‏            justify-content: space-between;
‏            align-items: center;
        }

‏        header h2 {
‏            margin: 0;
        }

‏        .logout {
‏            background: #d32f2f;
‏            color: white;
‏            border: none;
‏            padding: 10px 18px;
‏            border-radius: 8px;
‏            cursor: pointer;
        }

‏        .container {
‏            width: 95%;
‏            max-width: 1200px;
‏            margin: 25px auto;
        }

‏        .cards {
‏            display: grid;
‏            grid-template-columns: repeat(3, 1fr);
‏            gap: 20px;
‏            margin-bottom: 25px;
        }

‏        .card {
‏            background: white;
‏            padding: 25px;
‏            border-radius: 14px;
‏            text-align: center;
‏            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

‏        .card h3 {
‏            margin-top: 0;
‏            color: #666;
        }

‏        .number {
‏            font-size: 25px;
‏            font-weight: bold;
        }

‏        .table-box {
‏            background: white;
‏            padding: 20px;
‏            border-radius: 14px;
‏            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }

‏        .search {
‏            width: 100%;
‏            padding: 13px;
‏            margin: 15px 0 20px;
‏            border: 1px solid #ddd;
‏            border-radius: 8px;
‏            font-size: 16px;
        }

‏        .table-container {
‏            overflow-x: auto;
        }

‏        table {
‏            width: 100%;
‏            border-collapse: collapse;
‏            min-width: 650px;
        }

‏        th,
‏        td {
‏            padding: 14px;
‏            border-bottom: 1px solid #eee;
‏            text-align: center;
        }

‏        th {
‏            background: #eee;
        }

‏        a {
‏            color: #1565c0;
‏            text-decoration: none;
        }

‏        .error {
‏            color: red;
‏            text-align: center;
‏            padding: 20px;
        }

‏        @media (max-width: 700px) {
‏            .cards {
‏                grid-template-columns: 1fr;
            }

‏            header {
‏                flex-direction: column;
‏                gap: 15px;
            }
        }
‏    </style>
‏</head>


‏<body>

‏    <header>

‏        <h2>پنل مدیریت حمید مارکت</h2>
